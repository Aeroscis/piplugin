# ci - build the project and run every automated check on Windows.
#
# The checks themselves live in scripts/verify.ps1, not in this file: the same
# command can be run on a laptop before pushing, and changing the checks is then
# reviewed like code. This workflow only installs dependencies and builds.
#
# Qt is deliberately off: Qt5 is a local install in this project (see
# CMakeLists.txt) and the runner has none. imgui comes from Conan as usual, and
# verify.ps1 discovers which test plugins actually exist, so the conformance
# harness covers the imgui plugin here and both of them locally.
#
# The pixel-level resize regression (scripts/verify_resize_fix.ps1) is not part
# of CI yet: it depends on DWM composition behaving on the runner.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # The first conan install compiles imgui locally (no prebuilt Debug package).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # verify.ps1 and scripts/*.ps1 are Python-free, but the conan recipe and the
      # tooling below are not, and setup-python is what guarantees `python` on the
      # runner. clang-format is pinned so the drift report is deterministic and
      # matches what a contributor sees locally.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install conan and clang-format
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.0,<3" "clang-format==19.1.5"

      - name: Conan profile
        run: conan profile detect --force

      - name: Conan install
        run: >-
          conan install . --build=missing -s build_type=Debug
          -o PI_BUILD_ADAPTER_QT=False
          -o PI_BUILD_TEST_HOST_QT=False
          -o PI_BUILD_TEST_PLUGIN=False

      - name: Configure
        run: cmake --preset conan-default

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Verify
        run: pwsh -NoProfile -File scripts/verify.ps1

      - name: Upload host logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-logs
          path: |
            bin/Debug/*.log
            build/selftest.txt
          if-no-files-found: ignore
